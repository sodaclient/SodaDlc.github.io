<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SodaDlc Launcher</title>
<style>
  :root {
    --bg: #070907;
    --bg-2: #0c100b;
    --panel: rgba(18, 23, 16, 0.72);
    --panel-2: rgba(24, 31, 21, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f6ec;
    --muted: #93a08b;
    --muted-2: #6d7a66;
    --accent: #b7ff3c;
    --accent-strong: #d4ff7a;
    --accent-soft: rgba(183, 255, 60, 0.12);
    --danger: #ff5d4d;
    --radius: 18px;
    --font: "Segoe UI", "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  body {
    position: relative;
    background:
      radial-gradient(900px 520px at 8% -10%, rgba(183, 255, 60, 0.14), transparent 62%),
      radial-gradient(760px 520px at 108% 12%, rgba(88, 213, 255, 0.08), transparent 60%),
      radial-gradient(700px 700px at 50% 120%, rgba(183, 255, 60, 0.07), transparent 60%),
      var(--bg);
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 40%, #000 30%, transparent 78%);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(183,255,60,0.35); }

  .app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

  .screen {
    position: absolute;
    inset: 0;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .screen.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }

  .logo { width: 44px; height: 44px; flex-shrink: 0; filter: drop-shadow(0 6px 20px rgba(183,255,60,0.25)); }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .brand-name em { font-style: normal; color: var(--accent); }
  .brand-tag { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted-2); margin-top: 2px; }

  .splash {
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
  }
  .splash .logo { width: 96px; height: 96px; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .splash-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
  .splash-title em { font-style: normal; color: var(--accent); }
  .splash-sub { color: var(--muted); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
  .bar { width: 190px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #eaffb0); animation: load 1.15s ease-in-out infinite; }
  @keyframes load { 0% { transform: translateX(-110%) } 100% { transform: translateX(320%) } }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .chip.plan { color: var(--accent); border-color: rgba(183,255,60,0.28); background: var(--accent-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .chip.user { color: var(--text); }

  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); cursor: pointer;
    transition: 0.18s ease;
  }
  .icon-btn:hover { color: var(--danger); border-color: rgba(255,93,77,0.35); background: rgba(255,93,77,0.08); }
  .icon-btn svg { width: 16px; height: 16px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; margin-right: -4px; }

  .welcome { margin-bottom: 16px; }
  .welcome h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .welcome p { margin-top: 5px; color: var(--muted); font-size: 13px; }
  .welcome p b { color: var(--accent); font-weight: 600; }

  .cards { display: flex; flex-direction: column; gap: 12px; }

  .card {
    position: relative;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: linear-gradient(160deg, rgba(28, 35, 24, 0.85), rgba(12, 16, 11, 0.9));
    padding: 16px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(220px 120px at 100% 0%, var(--card-glow, rgba(183,255,60,0.16)), transparent 70%);
    opacity: 0.55; pointer-events: none;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.16); }
  .card.active {
    border-color: var(--card-accent);
    box-shadow: 0 0 0 1px var(--card-accent) inset, 0 14px 40px -18px var(--card-accent);
  }
  .card-head { display: flex; align-items: flex-start; gap: 12px; position: relative; }
  .card-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--card-soft); border: 1px solid var(--card-border);
    color: var(--card-accent);
  }
  .card-icon svg { width: 21px; height: 21px; }
  .card-titles { flex: 1; min-width: 0; }
  .card-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .card-title span { color: var(--card-accent); }
  .card-kind {
    display: inline-block; margin-top: 5px; padding: 3px 8px; border-radius: 6px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--card-accent); background: var(--card-soft); border: 1px solid var(--card-border);
  }
  .card-ver { font-family: var(--mono); font-size: 11px; color: var(--muted-2); margin-top: 7px; }

  .card-desc { margin-top: 12px; color: var(--muted); font-size: 12.5px; line-height: 1.55; position: relative; }
  .feats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; position: relative; }
  .feat {
    font-size: 10.5px; color: var(--muted); padding: 4px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.05);
  }
  .feat::before { content: "•"; color: var(--card-accent); margin-right: 5px; }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; position: relative; }
  .select-hint { font-size: 11px; color: var(--muted-2); display: flex; align-items: center; gap: 6px; }
  .select-hint svg { width: 13px; height: 13px; }
  .card.active .select-hint { color: var(--card-accent); }

  .btn {
    border: none; cursor: pointer; font-family: var(--font); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 15px; height: 15px; }

  .btn-launch {
    padding: 11px 20px; border-radius: 12px; font-size: 13px;
    background: var(--card-accent); color: #0a0d07;
    box-shadow: 0 8px 24px -10px var(--card-accent);
  }
  .btn-launch:hover { filter: brightness(1.08); }
  .btn-launch:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.4); }

  .btn-primary {
    width: 100%; padding: 13px 18px; border-radius: 12px; font-size: 14px;
    background: linear-gradient(180deg, var(--accent-strong), var(--accent));
    color: #0a0d07; box-shadow: 0 12px 30px -12px var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:disabled { opacity: 0.6; cursor: wait; }
  .btn-ghost {
    padding: 10px 16px; border-radius: 10px; font-size: 12.5px;
    background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: rgba(183,255,60,0.4); color: var(--accent); }

  .panel {
    margin-top: 16px; padding: 16px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--border);
  }
  .panel-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 12px; }
  .key-row { display: flex; gap: 8px; }
  .input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font); font-size: 13px; outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
    user-select: text;
  }
  .input::placeholder { color: var(--muted-2); }
  .input:focus { border-color: rgba(183,255,60,0.55); box-shadow: 0 0 0 3px rgba(183,255,60,0.1); }
  .key-row .input { font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .sub-line { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .sub-line b { color: var(--accent); }

  .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .login-card {
    padding: 24px; border-radius: 22px;
    background: linear-gradient(165deg, rgba(24,30,21,0.9), rgba(10,13,9,0.92));
    border: 1px solid var(--border);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.9);
  }
  .login-head { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-bottom: 22px; }
  .login-head .logo { width: 56px; height: 56px; }
  .login-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .login-head p { color: var(--muted); font-size: 12.5px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted-2); margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase; }
  .login-foot { margin-top: 16px; text-align: center; font-size: 12px; color: var(--muted-2); }
  .login-foot a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .login-foot a:hover { text-decoration: underline; }
  .server-toggle {
    margin-top: 14px; font-size: 11.5px; color: var(--muted-2); cursor: pointer;
    display: flex; align-items: center; gap: 6px; justify-content: center;
  }
  .server-toggle:hover { color: var(--accent); }
  .server-box { margin-top: 10px; display: none; }
  .server-box.open { display: block; }
  .err {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px;
    background: rgba(255,93,77,0.1); border: 1px solid rgba(255,93,77,0.3); color: #ff9d92;
    display: none;
  }
  .err.show { display: block; }

  .footer-note { margin-top: 14px; text-align: center; font-size: 10.5px; color: var(--muted-2); line-height: 1.6; }

  .toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; width: calc(100% - 48px); max-width: 420px; }
  .toast {
    padding: 11px 14px; border-radius: 12px; font-size: 12.5px;
    background: rgba(20,26,17,0.95); border: 1px solid var(--border);
    box-shadow: 0 16px 40px -20px rgba(0,0,0,0.9);
    animation: toast-in 0.24s ease;
  }
  .toast.ok { border-color: rgba(183,255,60,0.35); color: var(--accent-strong); }
  .toast.err { border-color: rgba(255,93,77,0.4); color: #ff9d92; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.25); border-top-color: #0a0d07;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>

<script>
  const DEFAULT_SERVER = "https://sodadlc.onrender.com";
  const APP_VERSION = "1.0.0";

  const VERSIONS = {
    "SodaDlc Legit": {
      accent: "#b7ff3c", soft: "rgba(183,255,60,0.12)", border: "rgba(183,255,60,0.28)",
      kind: "Legit", tag: "SAFE",
      desc: "Чистый и аккуратный визуал для повседневной игры. Минимум вмешательства, максимум стабильности и плавности.",
      feats: ["Безопасный рендер", "Плавные анимации", "Стабильный FPS"]
    },
    "SodaDlc Rage": {
      accent: "#ff5a3c", soft: "rgba(255,90,60,0.12)", border: "rgba(255,90,60,0.3)",
      kind: "Rage", tag: "MAX",
      desc: "Агрессивный визуал с максимальной выразительностью. Яркие эффекты, сочные цвета и полная отдача картинки.",
      feats: ["Яркие эффекты", "Сочные цвета", "Максимальная отдача"]
    },
    "SodaVisuals": {
      accent: "#58d5ff", soft: "rgba(88,213,255,0.12)", border: "rgba(88,213,255,0.3)",
      kind: "Visuals", tag: "CLASSIC",
      desc: "Классические визуалы SodaVisuals. Проверенная временем картинка с современными шейдерами и стабильной работой.",
      feats: ["Классический стиль", "Новые шейдеры", "Проверенная стабильность"]
    }
  };

  const $ = (s) => document.querySelector(s);
  const state = { user: null, sub: null, selected: localStorage.getItem("soda_version") || "SodaDlc Legit" };

  function server() {
    const saved = localStorage.getItem("soda_server");
    return (saved || DEFAULT_SERVER).replace(/\/+$/, "");
  }

  function token() { return localStorage.getItem("soda_token") || ""; }

  function showToast(msg, type) {
    const el = document.createElement("div");
    el.className = "toast " + (type || "ok");
    el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .25s ease, transform .25s ease";
      el.style.opacity = "0";
      el.style.transform = "translateY(8px)";
      setTimeout(() => el.remove(), 260);
    }, 3200);
  }

  function showScreen(name) {
    ["splash", "login", "main"].forEach((n) => {
      $("#screen-" + n).classList.toggle("hidden", n !== name);
    });
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = { "Accept": "application/json", "Content-Type": "application/json" };
    if (token()) headers["Authorization"] = "Bearer " + token();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);
    let res;
    try {
      res = await fetch(server() + path, {
        method: opts.method || "GET",
        headers,
        signal: controller.signal,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    } catch (e) {
      throw new Error(e.name === "AbortError"
        ? "Сервер не отвечает. Возможно, он просыпается — попробуйте ещё раз."
        : "Нет связи с сервером. Проверьте адрес сайта.");
    } finally {
      clearTimeout(timer);
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/api/launcher/auth") {
      clearAuth();
      showScreen("login");
      throw new Error("Сессия истекла, войдите снова");
    }
    if (!res.ok) throw new Error(data.error || "Ошибка сервера (" + res.status + ")");
    return data;
  }

  function clearAuth() {
    localStorage.removeItem("soda_token");
    state.user = null;
    state.sub = null;
  }

  function planLabel(plan) {
    return { free: "Free", pro: "Pro", premium: "Premium" }[plan] || plan || "Free";
  }

  function daysLeft(ts) {
    if (!ts) return null;
    return Math.max(0, Math.ceil((ts - Date.now()) / 864e5));
  }

  function osName() {
    const ua = navigator.userAgent || "";
    if (ua.includes("Windows")) return "windows";
    if (ua.includes("Mac")) return "macos";
    if (ua.includes("Linux")) return "linux";
    return "unknown";
  }

  function applyUser(data) {
    state.user = data.user || state.user;
    state.sub = data.subscription || state.sub;
    const u = state.user;
    if (!u) return;
    $("#chipUser").textContent = u.username;
    const plan = (state.sub && state.sub.plan) || u.plan || "free";
    $("#chipPlan").textContent = planLabel(plan);
    $("#greeting").textContent = "С возвращением, " + u.username;
    const exp = state.sub && state.sub.expiresAt;
    const dl = daysLeft(exp);
    $("#subInfo").innerHTML = "Подписка: <b>" + planLabel(plan) + "</b>" +
      (dl !== null ? " · осталось " + dl + " дн." : "");
    $("#daysLeft").textContent = dl !== null ? dl + " дн." : (plan === "free" ? "нет подписки" : "бессрочно");
  }

  function iconFor(key) {
    if (key === "SodaDlc Rage") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
    }
    if (key === "SodaVisuals") {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>';
  }

  function renderCards() {
    const wrap = $("#cards");
    wrap.innerHTML = Object.keys(VERSIONS).map((key) => {
      const v = VERSIONS[key];
      const active = key === state.selected;
      return '<div class="card' + (active ? " active" : "") + '" data-key="' + key + '" style="--card-accent:' + v.accent + ';--card-soft:' + v.soft + ';--card-border:' + v.border + ';--card-glow:' + v.soft + '">' +
        '<div class="card-head">' +
          '<div class="card-icon">' + iconFor(key) + '</div>' +
          '<div class="card-titles">' +
            '<div class="card-title">' + key + '</div>' +
            '<span class="card-kind">' + v.tag + '</span>' +
            '<div class="card-ver" data-ver="' + key + '">v' + APP_VERSION + '</div>' +
          '</div>' +
        '</div>' +
        '<p class="card-desc">' + v.desc + '</p>' +
        '<div class="feats">' + v.feats.map((f) => '<span class="feat">' + f + '</span>').join("") + '</div>' +
        '<div class="card-foot">' +
          '<span class="select-hint">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
            (active ? "Выбрано" : "Выбрать") +
          '</span>' +
          '<button class="btn btn-launch" data-launch="' + key + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
            'Запустить' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join("");

    wrap.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => selectVersion(card.dataset.key));
    });
    wrap.querySelectorAll("[data-launch]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        selectVersion(btn.dataset.launch);
        showToast("Запуск " + btn.dataset.launch + " появится в следующем обновлении", "ok");
      });
    });
  }

  function selectVersion(key) {
    state.selected = key;
    localStorage.setItem("soda_version", key);
    const v = VERSIONS[key];
    document.documentElement.style.setProperty("--accent", v.accent);
    document.documentElement.style.setProperty("--accent-strong", v.accent === "#b7ff3c" ? "#d4ff7a" : v.accent);
    document.documentElement.style.setProperty("--accent-soft", v.soft);
    renderCards();
    loadVersion(key);
  }

  async function loadVersion(key) {
    try {
      const data = await api("/api/launcher/version?brand=" + encodeURIComponent(key) + "&current=" + APP_VERSION);
      const el = document.querySelector('[data-ver="' + key + '"]');
      if (el && data.version) el.textContent = "v" + data.version;
    } catch (e) {}
  }

  async function login(username, password) {
    const data = await api("/api/launcher/auth", {
      method: "POST",
      body: {
        username, password,
        brand: state.selected,
        version: APP_VERSION,
        os: osName(),
        arch: "x64"
      }
    });
    localStorage.setItem("soda_token", data.token);
    state.user = data.user;
    state.sub = data.subscription;
  }

  async function refreshStatus() {
    const data = await api("/api/launcher/status");
    applyUser(data);
    return data;
  }

  async function activateKey(key) {
    const data = await api("/api/launcher/activate", {
      method: "POST",
      body: { key, brand: state.selected, version: APP_VERSION, os: osName(), arch: "x64" }
    });
    state.sub = data.subscription;
    await refreshStatus();
  }

  function bind() {
    $("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("#loginErr");
      err.classList.remove("show");
      const username = $("#username").value.trim();
      const password = $("#password").value;
      if (!username || !password) {
        err.textContent = "Введите ник и пароль";
        err.classList.add("show");
        return;
      }
      const savedServer = $("#serverInput").value.trim();
      if (savedServer) localStorage.setItem("soda_server", savedServer.replace(/\/+$/, ""));
      const btn = $("#loginBtn");
      const old = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Входим...';
      try {
        await login(username, password);
        await refreshStatus();
        showToast("Добро пожаловать, " + username, "ok");
        showScreen("main");
        loadVersion(state.selected);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add("show");
        clearAuth();
      } finally {
        btn.disabled = false;
        btn.innerHTML = old;
      }
    });

    $("#serverToggle").addEventListener("click", () => {
      $("#serverBox").classList.toggle("open");
    });

    $("#registerLink").addEventListener("click", () => {
      showToast("Откройте " + server() + "/register в браузере", "ok");
    });

    $("#logoutBtn").addEventListener("click", () => {
      clearAuth();
      $("#password").value = "";
      showScreen("login");
      showToast("Вы вышли из аккаунта", "ok");
    });

    $("#activateBtn").addEventListener("click", async () => {
      const key = $("#keyInput").value.trim();
      if (!key) return showToast("Введите ключ", "err");
      const btn = $("#activateBtn");
      btn.disabled = true;
      try {
        await activateKey(key);
        $("#keyInput").value = "";
        showToast("Ключ активирован!", "ok");
      } catch (ex) {
        showToast(ex.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    $("#keyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("#activateBtn").click();
    });
  }

  async function boot() {
    const override = new URLSearchParams(location.search).get("server");
    if (override) localStorage.setItem("soda_server", override.replace(/\/+$/, ""));
    bind();
    $("#serverInput").value = server();
    $("#serverNote").textContent = "Сервер: " + server();
    selectVersion(state.selected);
    await new Promise((r) => setTimeout(r, 900));
    if (!token()) {
      showScreen("login");
      return;
    }
    try {
      await refreshStatus();
      showScreen("main");
      loadVersion(state.selected);
    } catch (e) {
      clearAuth();
      showScreen("login");
    }
  }

  boot();
</script>
</body>
</html>
