<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — SodaDlc</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>С возвращением</h1>
      <p>Войди в SodaDlc, чтобы управлять подпиской и ключами.</p>
      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-error hidden" id="loginError"></div>
        <div class="field">
          <label for="username">Ник</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="lorezzzz" maxlength="16" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button class="btn block" type="submit" id="loginBtn">Войти</button>
      </form>
      <div class="auth-alt">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
    (async () => {
      const user = await SODA.me().catch(() => null);
      if (user) location.replace("/cabinet");

      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("loginError");
      const button = document.getElementById("loginBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("hidden");
        button.disabled = true;
        button.textContent = "Входим…";
        try {
          await SODA.api("/api/login", {
            method: "POST",
            body: {
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            },
          });
          const next = new URLSearchParams(location.search).get("next");
          location.href = next && next.startsWith("/") ? next : "/cabinet";
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.remove("hidden");
          button.disabled = false;
          button.textContent = "Войти";
        }
      });
    })();
  </script>
</body>
</html>
