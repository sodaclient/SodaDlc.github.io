services:
  - type: web
    name: sodadlc
    runtime: node
    plan: free
    buildCommand: "npm ci"
    startCommand: "node server.js"
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
