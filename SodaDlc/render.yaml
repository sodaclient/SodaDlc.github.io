services:
  - type: web
    name: sodadlc
    runtime: node
    plan: free
    buildCommand: "echo no build required"
    startCommand: "node --experimental-sqlite server.js"
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_PASSWORD
        generateValue: true
