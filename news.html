<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новости — SodaDlc</title>
  <meta name="description" content="Новости и обновления SodaDlc." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css?v=13" />
</head>
<body>
  <div id="site-header"></div>
  <main class="container section">
    <div class="section-head">
      <div>
        <div class="eyebrow">Блог проекта</div>
        <h2>Новости SodaDlc</h2>
        <p>Обновления, объявления и полезные гайды по аккаунту и подписке.</p>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"><div class="loader"></div></div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js?v=7"></script>
  <script>
    (async () => {
      try {
        const { news } = await SODA.api("/api/news");
        document.getElementById("newsGrid").innerHTML = news.length
          ? news.map((n) => `
              <article class="news-card">
                <div class="meta">
                  ${n.pinned ? '<span class="pin">Закреплено</span>' : ""}
                  <span>${SODA.fmtDate(n.created_at)}</span><span>•</span><span>${SODA.escapeHtml(n.author)}</span>
                </div>
                <h3>${SODA.escapeHtml(n.title)}</h3>
                <p>${SODA.escapeHtml(n.body)}</p>
              </article>`).join("")
          : '<div class="empty">Пока новостей нет.</div>';
      } catch (err) {
        document.getElementById("newsGrid").innerHTML = '<div class="empty">Не удалось загрузить новости.</div>';
      }
    })();
  </script>
</body>
</html>
